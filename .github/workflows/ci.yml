name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  APP_ENV: testing
  APP_KEY: base64:placeholder-key-for-testing
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: homestay_test
  DB_USERNAME: root
  DB_PASSWORD: password
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: homestay_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, mysql, redis
        coverage: xdebug

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Cache composer dependencies
      uses: actions/cache@v3
      with:
        path: vendor
        key: composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          composer-

    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist --no-progress --no-suggest

    - name: Install Node dependencies
      run: npm ci

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Generate app key
      run: php artisan key:generate --ansi

    - name: Run database migrations
      run: php artisan migrate --force

    - name: Run PHPStan static analysis
      run: vendor/bin/phpstan analyse --no-progress

    - name: Run Laravel Pint code style check
      run: vendor/bin/pint --test

    - name: Run PHPUnit tests
      run: php artisan test --coverage-clover=coverage.xml

    - name: Run ESLint and Prettier
      run: |
        npm run lint || echo "ESLint not configured, skipping..."
        
    - name: Build frontend assets
      run: npm run build

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Install Node dependencies
      run: npm ci

    - name: Run composer audit
      run: composer audit --format=plain || true

    - name: Run npm audit
      run: npm audit --audit-level=moderate || true